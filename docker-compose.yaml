version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      # - --api.dashboard=true          # optional: uncomment for the Traefik dashboard
      # - --api.insecure=false
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_ROOT}/traefik/letsencrypt:/letsencrypt
      - ${DOCKER_ROOT}/traefik/dynamic:/etc/traefik/dynamic
    ports:
      - "443:443"
      - "80:80"
    restart: unless-stopped
    networks:
      - default
      - proxy

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/bazarr/config:/config
      - ${DATA_ROOT}/media/movies:/movies #optional
      - ${DATA_ROOT}/media/tv:/tv #optional
    ports:
      - 6767:6767
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)
      - traefik.http.services.bazarr.loadbalancer.server.port=6767

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK_SET=022
    volumes:
      - ${DOCKER_ROOT}/deluge/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8112:8112
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.deluge.rule=Host(`torrent.${DOMAIN}`)
      - traefik.http.services.deluge.loadbalancer.server.port=8112

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/nzbget/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - 6789:6789
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.nzbget.rule=Host(`nzbget.${DOMAIN}`)
      - traefik.http.services.nzbget.loadbalancer.server.port=6789

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
      - TZ=${TIMEZONE}
      - UMASK_SET=022
    volumes:
      - ${DOCKER_ROOT}/plex/config:/config
      - ${DATA_ROOT}/media/tv:/tv
      - ${DATA_ROOT}/media/movies:/movies
    restart: unless-stopped
    # No Traefik labels: network_mode: host containers can't be routed via
    # Docker labels (no discoverable port). Routed instead via Traefik's
    # file provider — see traefik/dynamic/host-services.yml.

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/tautulli/config:/config
    ports:
      - 8181:8181
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.tautulli.rule=Host(`tautulli.${DOMAIN}`)
      - traefik.http.services.tautulli.loadbalancer.server.port=8181

  plex-meta-manager:
    image: lscr.io/linuxserver/plex-meta-manager:latest
    container_name: plex-meta-manager
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - PMM_CONFIG=/config/config.yml
      - PMM_TIME=03:00 #optional
      - PMM_RUN=False #optional
      - UMASK_SET=022
    volumes:
      - ${DOCKER_ROOT}/plex/config:/config
    restart: unless-stopped
    # No Traefik labels: this runs as a scheduled job, not a web UI.

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK_SET=022
    volumes:
      - ${DOCKER_ROOT}/radarr/config:/config
      - ${DATA_ROOT}:/data #optional
    ports:
      - 7878:7878
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`movies.${DOMAIN}`)
      - traefik.http.services.radarr.loadbalancer.server.port=7878

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK_SET=022
    volumes:
      - ${DOCKER_ROOT}/sonarr/config:/config
      - ${DATA_ROOT}:/data #optional
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`tv.${DOMAIN}`)
      - traefik.http.services.sonarr.loadbalancer.server.port=8989

  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_ROOT}/homeassistant/config:/config
    restart: unless-stopped
    # No Traefik labels: same reason as Plex above — routed via the file
    # provider instead of Docker labels.

  actualserver:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actualserver
    # environment:
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.github.io/docs/Installing/Configuration
    volumes:
      - ${DOCKER_ROOT}/actualserver:/data
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.actualserver.rule=Host(`expenses.${DOMAIN}`)
      - traefik.http.services.actualserver.loadbalancer.server.port=5006

  actual-mcp:
    image: sstefanov/actual-mcp:latest
    container_name: actual-mcp
    # Talks to actualserver over the internal docker network and exposes an
    # MCP (Model Context Protocol) endpoint that Claude Code can connect to.
    command: ['--sse', '--enable-write', '--enable-bearer']
    environment:
      - ACTUAL_SERVER_URL=http://actualserver:5006
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD}
      - ACTUAL_BUDGET_SYNC_ID=${ACTUAL_BUDGET_SYNC_ID}
      - BEARER_TOKEN=${ACTUAL_MCP_BEARER_TOKEN}
    volumes:
      - ${DOCKER_ROOT}/actual-mcp:/data
    ports:
      - '3031:3000'
    depends_on:
      - actualserver
    restart: unless-stopped
    # No Traefik label: this is a machine-to-machine endpoint for Claude Code,
    # not something you'd browse to. Leave it on its internal port only.

networks:
  proxy:
    external: true
    name: proxy